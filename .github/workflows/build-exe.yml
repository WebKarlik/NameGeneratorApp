name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build app image (NameGenerator.exe)
        shell: cmd
        run: build.bat

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: NameGenerator-windows
          path: dist/NameGenerator
          if-no-files-found: error
